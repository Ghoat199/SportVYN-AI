name: SportVYN history audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview historical matches
        run: node scripts/preview-history-import.mjs 2024 2025 > history-preview.json
      - name: Prepare existing Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          curl --fail --silent --show-error --get --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" > project-response.json
          ORG_ID=$(jq -r '.accountId // empty' project-response.json)
          test -n "$ORG_ID"
          mkdir -p .vercel
          jq -n --arg org "$ORG_ID" --arg project "$VERCEL_PROJECT_ID" '{orgId:$org,projectId:$project}' > .vercel/project.json
          rm project-response.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" > /dev/null
      - name: Compare historical matches with Supabase (read only)
        run: node --env-file=.vercel/.env.production.local scripts/compare-history.mjs 2024 2025 > history-comparison.json
      - name: Audit database fields
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-history-schema.mjs > history-schema.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportvyn-history-audit
          path: |
            history-preview.json
            history-schema.json
            history-comparison.json
          if-no-files-found: warn
